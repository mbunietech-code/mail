<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Roboto,Arial,sans-serif;background:linear-gradient(160deg,#1b1f5e,#1FA3E6);min-height:100vh;color:#fff}
.status{display:flex;justify-content:space-between;padding:10px 20px;font-size:14px}
.splash{background:#fff;margin:24px 16px;border-radius:28px;padding:36px 20px;text-align:center;color:#2B2F86}
.splash img{width:100%;max-width:340px}
.splash p{margin:12px 0 0;color:#5a5f8f;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 8px;padding:20px 16px}
.app{display:flex;flex-direction:column;align-items:center;font-size:12px;gap:6px}
.app i{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.25);display:block}
.app img{width:58px;height:58px;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.3)}
</style></head><body>
<div class="status"><span>9:41</span><span>5G ▮▮▮ 92%</span></div>
<div class="splash"><img src="mbunie-mail-logo.svg" alt="Mbunie Mail"><p>Karibu Mbunie Mail</p></div>
<div class="grid">
<div class="app"><img src="mbunie-mail-icon.svg"><span>Mbunie Mail</span></div>
<div class="app"><i></i><span>Simu</span></div><div class="app"><i></i><span>Ujumbe</span></div><div class="app"><i></i><span>Kamera</span></div>
<div class="app"><i></i><span>Picha</span></div><div class="app"><i></i><span>Ramani</span></div><div class="app"><i></i><span>Saa</span></div><div class="app"><i></i><span>Mipangilio</span></div>
</div></body></html>
