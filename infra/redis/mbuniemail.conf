# Append to /etc/redis/redis.conf (Redis 7). Localhost only, password, dangerous admin commands disabled.
# FLUSHDB stays available: `php artisan cache:clear` needs it.
bind 127.0.0.1 -::1
protected-mode yes
port 6379
# Generate with: openssl rand -hex 32  — put the same value in backend .env REDIS_PASSWORD
requirepass CHANGE_ME_REDIS_PASSWORD
rename-command FLUSHALL ""
rename-command CONFIG ""
rename-command DEBUG ""
maxmemory 512mb
maxmemory-policy noeviction   # queues and rate limiters must never be silently evicted
appendonly yes
