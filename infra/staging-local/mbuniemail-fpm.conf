; PHP-FPM pool for MbunieMail (/etc/php/8.4/fpm/pool.d/mbuniemail.conf)
[mbuniemail]
user = mbuniemail
group = mbuniemail
listen = /run/php/mbuniemail-fpm.sock
listen.owner = www-data
listen.group = www-data
; LOCAL STACK ONLY: the nginx image runs as user "nginx", not www-data as on Ubuntu.
listen.mode = 0666

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
request_terminate_timeout = 65s

; Keep the environment clean; config comes from .env (config:cache).
clear_env = yes

php_admin_value[expose_php] = Off
php_admin_value[display_errors] = Off
php_admin_value[log_errors] = On
php_admin_value[error_log] = /var/log/php/mbuniemail-fpm.log
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 26M
php_admin_value[post_max_size] = 30M
php_admin_value[max_execution_time] = 60
; Exception traces must not contain call arguments (passwords, tokens) — risk R-19.
php_admin_value[zend.exception_ignore_args] = On
php_admin_value[session.use_strict_mode] = 1
php_admin_value[open_basedir] = /srv/mbuniemail/:/etc/mbuniemail/:/tmp/:/usr/local/lib/php/
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
php_admin_value[allow_url_include] = Off
