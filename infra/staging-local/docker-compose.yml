# Production-like local stack: the real infra/nginx + infra/php configs in containers,
# joined to the dev MariaDB/Redis network. Used for SEC-T41 (testssl), ZAP and header checks.
#   infra/staging-local/up.sh      (generates the env file, builds, starts)
name: mbuniemail-staging-local
services:
  php:
    build: { context: ., dockerfile: Dockerfile.php }
    volumes:
      - ../..:/srv/mbuniemail/current:ro
      - ../../backend/storage:/srv/mbuniemail/current/backend/storage
      - ./generated/.env:/srv/mbuniemail/current/backend/.env:ro
      - ./generated/kek.json:/etc/mbuniemail/keys/kek.json:ro
      - fpm-socket:/run/php
    networks: [dev]
  nginx:
    image: nginx:1.27
    depends_on: [php]
    volumes:
      - ./generated/site.conf:/etc/nginx/conf.d/default.conf:ro
      - ./generated/tls:/etc/letsencrypt/live/localhost:ro
      - ../..:/srv/mbuniemail/current:ro
      - fpm-socket:/run/php
    ports: ["127.0.0.1:8443:443"]
    networks: [dev]
volumes:
  fpm-socket:
networks:
  dev:
    external: true
    name: mbuniemail-dev_default
