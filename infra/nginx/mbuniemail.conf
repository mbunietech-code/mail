# MbunieMail API + admin panel — Nginx (Ubuntu 24.04). Replace API_HOST.
# TLS: Mozilla "intermediate" profile. Certificates via certbot (see docs/DEPLOYMENT.md §6).

limit_req_zone $binary_remote_addr zone=mbm_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=mbm_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name API_HOST;
    # ACME challenges only; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name API_HOST;

    ssl_certificate     /etc/letsencrypt/live/API_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/API_HOST/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MBM_TLS:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    root /srv/mbuniemail/current/backend/public;
    index index.php;
    charset utf-8;

    server_tokens off;
    client_max_body_size 30m;        # 25 MB attachments + multipart overhead
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;

    # The application sets the detailed headers (CSP, frame, referrer, …); HSTS here too
    # so it also covers static files.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/mbuniemail.access.log;
    error_log  /var/log/nginx/mbuniemail.error.log warn;

    # Never serve dotfiles, VCS metadata, or anything outside public/.
    location ~ /\.(?!well-known) { deny all; return 404; }

    # Stricter limit on credential endpoints (in addition to application limits).
    location ~ ^/(api/v1/auth/(login|refresh|password|mfa)|admin/(login|mfa|reauth)) {
        limit_req zone=mbm_auth burst=10 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        limit_req zone=mbm_per_ip burst=40 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass unix:/run/php/mbuniemail-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # No other PHP file is executable.
    location ~ \.php$ { return 404; }
}
